<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ファミスタ (Three.js)</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #app canvas {
        display: block;
      }
      #hud {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        pointer-events: none;
        color: #fff;
        font-family: 'Courier New', monospace;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="hud"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
